# Class metadata joined into ModelManifest.json at export time.
#
# Keys are class ids and must match the directory names under data/train/
# (and therefore the class labels embedded in the exported Core ML model).
#
# riskLevel must be exactly one of: low, moderate, high. Those three raw
# values are frozen — the app persists them and the manifest schema declares
# them — but they are NOT a severity rating. The app renders them as next-step
# guidance:
#
#   low       -> "Routine"
#   moderate  -> "Worth asking about"
#   high      -> "See a professional soon"
#
# So pick a tier by answering "whether and how soon should someone ask a
# professional about this?", not "how bad is it?".
#
# displayName names a *reference category*, never something the user has. The
# app presents it as "looks most similar to X", never "you have X".
#
# summary describes the category and the suggested next step. It must not say
# what a finding is, how likely it is to be anything, or what it may become —
# the app compares images and has no basis for any of that. "Reference
# category for white patches that do not wipe away" is in scope; "a white
# patch that can show precancerous changes" is not.
#
# This file mirrors ModelManifest.mockOralLesions in
# OCRadarKit/Sources/OCRCore/ModelManifest.swift — keep the wording in sync.

# Note the name of this one. It labels the *reference set* — photographs of
# ordinary-looking tissue — and not the absence of a finding. "No visible
# lesion" is a negative statement about the person holding the phone, which is
# the rule-out the app disclaims; it surfaced as the 26pt headline on Home and
# read as a clearance. Whatever you call this class, keep it a category label.
healthy:
  displayName: Common tissue appearance
  riskLevel: low
  summary: Reference category for ordinary-looking mouth tissue with no distinct patch or sore. A close match here is not a clean bill of health.

aphthous_ulcer:
  displayName: Aphthous ulcer (canker sore)
  riskLevel: low
  summary: Reference category for small round sores inside the mouth. Mention it to a dentist if one lasts more than two weeks.

lichen_planus:
  displayName: Oral lichen planus
  riskLevel: moderate
  summary: Reference category for lacy white lines or patches, often on the inside of the cheek. Worth asking a dentist about.

leukoplakia:
  displayName: Leukoplakia
  riskLevel: moderate
  summary: Reference category for white patches that do not wipe away. Worth asking a dentist to take a look.

erythroplakia:
  displayName: Erythroplakia
  riskLevel: high
  summary: Reference category for red or velvety patches. Worth having a dentist or doctor look at it soon.
